name: Build KernelSU Kernel for umi (LineageOS 23.2)

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU-Next 分支/标签'
        required: false
        default: 'next'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ---------------------------------------------------------------
      - name: 拉取 LineageOS 内核源码
        run: |
          echo "==> cloning LineageOS/android_kernel_xiaomi_sm8250 (lineage-23.2)"
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8250 kernel
          cd kernel
          echo "HEAD = $(git rev-parse --short=12 HEAD)"
          echo "期望 = 71b13e62f057 (与手机上的内核比对)"

      # ---------------------------------------------------------------
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev libssl-dev libxml2 libxml2-utils lz4 lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 python-is-python3 \
            clang llvm lld libc6-dev-i386
          echo "--- 版本 ---"
          clang --version | head -1
          ld.lld --version | head -1
          make --version | head -1
          nproc

      # ---------------------------------------------------------------
      - name: 下载 LineageOS 官方 boot.img（作为打包模板）
        run: |
          mkdir -p template
          curl -L --retry 5 --retry-delay 3 -o template/boot_orig.img \
            "https://mirrorbits.lineageos.org/full/umi/20261025/boot.img"
          ls -lh template/boot_orig.img
          echo "--- sha256 ---"
          sha256sum template/boot_orig.img

      # ---------------------------------------------------------------
      - name: 集成 KernelSU-Next (legacy 分支，适配 4.19)
        working-directory: kernel
        run: |
          set -e
          # 关键：KernelSU-Next 没有 next/main/master 分支
          #   真实分支: dev, legacy, risk, test, samsung-lateload...
          #   4.19 内核必须用 legacy（含 compat/kernel_compat.o 兼容层）
          echo "==> clone legacy 分支"
          rm -rf KernelSU-Next
          git clone --depth=1 --branch legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next

          echo "--- kernel 目录 ---"
          ls -1 KernelSU-Next/kernel/ | head -25

          echo "--- Kconfig 有 config KSU 吗 ---"
          grep -n "config KSU" KernelSU-Next/kernel/Kconfig

          echo "--- Kbuild 有 obj- 吗 ---"
          grep -n "^obj-" KernelSU-Next/kernel/Kbuild

          echo "--- compat 目录（旧内核兼容层）---"
          ls -1 KernelSU-Next/kernel/compat/ 2>/dev/null || echo "  (无 compat)"

          echo ""
          echo "==> 创建符号链接 drivers/kernelsu"
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          ls -la drivers/kernelsu

          echo ""
          echo "==> 修改 drivers/Makefile"
          if ! grep -q "kernelsu" drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi
          echo "  末尾 3 行:"
          tail -3 drivers/Makefile

          echo ""
          echo "==> 修改 drivers/Kconfig（插入到 endmenu 前）"
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          echo "  末尾 5 行:"
          tail -5 drivers/Kconfig

          echo ""
          echo "==> 集成完成"

      - name: 修正 sepolicy.c 的 4.19 版本判断（写反了）
        working-directory: kernel
        run: |
          set -e
          # Linux 4.19: avtab.htable 是 struct flex_array *
          # Linux 5.0+: avtab.htable 是 struct avtab_node ** (数组)
          # KernelSU-Next 的 sepolicy.c 把两个分支写反了
          echo "" | base64 -d > /tmp/fix_sepolicy.py
          python3 /tmp/fix_sepolicy.py
          echo ""
          echo "--- 验证 ---"
          grep -n -A4 "LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)" KernelSU-Next/kernel/selinux/sepolicy.c | head -24

      - name: 修正 patch_memory.c 的宏污染（4.19 已有 copy_to_kernel_nofault）
        working-directory: kernel
        run: |
          set -e
          # KernelSU 认为 4.19 没有 copy_to_kernel_nofault（5.8 才引入）
          # 但 LineageOS 4.19.325 已经 backport，宏会污染 uaccess.h 的声明
          echo "" | base64 -d > /tmp/fix_patch_memory.py
          python3 /tmp/fix_patch_memory.py
          echo ""
          echo "--- 验证 ---"
          head -16 KernelSU-Next/kernel/hook/patch_memory.c
          echo ""
          echo "--- 确认宏已删除 ---"
          if grep -q '#define copy_to_kernel_nofault' KernelSU-Next/kernel/hook/patch_memory.c; then
            echo "  ❌ 宏还在"
            exit 1
          else
            echo "  ✅ 宏已删除，将使用内核自带的 copy_to_kernel_nofault"
          fi

      - name: 给 kernel/reboot.c 插入 KernelSU supercall 入口
        working-directory: kernel
        run: |
          set -e
          # KernelSU Manager 通过 reboot(MAGIC1, MAGIC2, ...) 与内核握手拿 fd
          # 原生 reboot.c 在 CAP_SYS_BOOT 检查处就 -EPERM 了
          # 必须在权限检查之前插入 ksu_handle_sys_reboot()
          echo "" | base64 -d > /tmp/fix_reboot_c.py
          python3 /tmp/fix_reboot_c.py
          echo ""
          echo "--- 验证 extern ---"
          grep -B1 -A3 'ksu_handle_sys_reboot' kernel/reboot.c | head -20
          echo ""
          echo "--- 验证插入位置（必须在 CAP_SYS_BOOT 之前）---"
          if grep -A12 'SYSCALL_DEFINE4(reboot' kernel/reboot.c | grep -q 'ksu_handle_sys_reboot'; then
            echo "  ✅ 已插入到 SYSCALL_DEFINE4(reboot) 内"
          else
            echo "  ❌ 插入失败"
            exit 1
          fi

      - name: 补 LineageOS 内核缺失的 min-tool-version.sh
        working-directory: kernel
        run: |
          # LineageOS 的 sm8250 内核缺 scripts/min-tool-version.sh，
          # 但 scripts/as-version.sh 会调用它，导致 Kconfig 报
          # "Sorry, this assembler is not supported."
          # 用 base64 内联避免 YAML 缩进破坏 heredoc 结束符
          if [ ! -f scripts/min-tool-version.sh ]; then
            echo "" | base64 -d > scripts/min-tool-version.sh
            chmod +x scripts/min-tool-version.sh
            echo "==> 已创建 scripts/min-tool-version.sh"
          else
            echo "==> 已存在，跳过"
          fi
          echo "--- 内容 ---"
          cat scripts/min-tool-version.sh
          echo "--- 验证 ---"
          sh scripts/min-tool-version.sh binutils

      - name: 生成 .config
        working-directory: kernel
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64

          echo "==> 基础 defconfig (kona-perf)"
          make O=out ARCH=arm64 vendor/kona-perf_defconfig

          echo "==> 合并 sm8250-common + umi fragments"
          ./scripts/kconfig/merge_config.sh -O out -m \
            out/.config \
            arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
            arch/arm64/configs/vendor/xiaomi/umi.config

          echo "==> 主动启用 KernelSU 相关配置"
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e MODULES

          # hook 模式选择（关键）：
          #   MANUAL_HOOK       → 需要手动往 kernel/reboot.c 插 ksu_handle_sys_reboot
          #   KPROBES_HOOK      → 官方注明「不要在 5.10 以下用」
          #   SYSCALL_TABLE_HOOK → 专门给非 GKI + 内核≥4.17，正是 4.19 的方案
          # 必须用 MANUAL_HOOK：
          #   SYSCALL_TABLE_HOOK 只 hook execve/execveat/faccessat/newfstatat
          #   没有 sys_reboot，Manager 的握手会失败
          ./scripts/config --file out/.config -e KSU_MANUAL_HOOK
          ./scripts/config --file out/.config -d KSU_KPROBES_HOOK
          ./scripts/config --file out/.config -d KSU_SYSCALL_TABLE_HOOK

          echo "--- 重新 olddefconfig 解析依赖 ---"
          make O=out ARCH=arm64 olddefconfig

          echo ""
          echo "==> 确认关键项"
          for k in CONFIG_MACH_XIAOMI_UMI CONFIG_KSU CONFIG_MODULES CONFIG_EROFS_FS; do
            v=$(grep -E "^${k}=" out/.config || true)
            if [ -z "$v" ]; then
              echo "  ❌ 未设置: $k"
            else
              echo "  ✅ $v"
            fi
          done
          echo ""
          echo "==> KSU 相关全部配置"
          grep -E "CONFIG_KSU" out/.config || echo "  (无 CONFIG_KSU)"

          echo ""
          echo "==> hook 模式确认"
          if grep -q "^CONFIG_KSU_MANUAL_HOOK=y" out/.config; then
            echo "  ✅ manual hook（含 reboot.c 握手，Manager 可用）"
          elif grep -q "^CONFIG_KSU_SYSCALL_TABLE_HOOK=y" out/.config; then
            echo "  ⚠️ syscall table hook（无 sys_reboot，Manager 无法握手）"
          elif grep -q "^CONFIG_KSU_KPROBES_HOOK=y" out/.config; then
            echo "  ⚠️ kprobes hook"
          else
            echo "  ❌ 没有 hook 模式被选中"
          fi 

      # ---------------------------------------------------------------
      - name: 编译内核
        working-directory: kernel
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64

          echo "==> 开始编译 (j=$(nproc))"
          time make O=out ARCH=arm64 -j$(nproc) \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo ""
          echo "==> 产物检查"
          ls -lh out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image || true

      # ---------------------------------------------------------------
      - name: 上传裸内核 Image（保险，打包失败也能拿到）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umi-linux-kernel-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtb
            kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7

      - name: 打包 boot.img
        run: |
          set -e
          # mkbootimg/unpack_bootimg 是 AOSP 的 Python 脚本，不是 PyPI 包
          echo "==> 下载 AOSP 官方工具"
          curl -sS "https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/mkbootimg.py?format=TEXT" | base64 -d > mkbootimg.py
          curl -sS "https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/unpack_bootimg.py?format=TEXT" | base64 -d > unpack_bootimg.py

          # mkbootimg.py 会 import gki.generate_gki_certificate，必须补上
          mkdir -p gki
          curl -sS "https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/gki/generate_gki_certificate.py?format=TEXT" | base64 -d > gki/generate_gki_certificate.py
          touch gki/__init__.py
          export PYTHONPATH="$PWD"

          chmod +x mkbootimg.py unpack_bootimg.py
          echo "--- 验证 gki 模块 ---"
          python3 -c "from gki.generate_gki_certificate import generate_gki_certificate; print('gki OK')"
          ls -la gki/
          echo "  mkbootimg.py: $(wc -c < mkbootimg.py) 字节"
          echo "  unpack_bootimg.py: $(wc -c < unpack_bootimg.py) 字节"

          echo ""
          echo "==> 解开原厂 boot.img"
          python3 unpack_bootimg.py --boot_img template/boot_orig.img --out unpacked
          echo "--- 解出内容 ---"
          ls -lh unpacked/

          echo ""
          echo "==> 替换内核"
          cp kernel/out/arch/arm64/boot/Image unpacked/kernel
          ls -lh unpacked/kernel

          echo ""
          echo "==> 从原 boot.img 提取打包参数（--format mkbootimg）"
          python3 unpack_bootimg.py --boot_img template/boot_orig.img --out unpacked --format mkbootimg > mkargs.txt
          echo "--- 提取到的参数 ---"
          cat mkargs.txt

          echo ""
          echo "==> 重新打包（沿用原参数，只换 kernel）"
          ARGS=$(cat mkargs.txt)
          python3 mkbootimg.py $ARGS --output boot_ksu.img

          echo ""
          echo "==> 结果"
          ls -lh boot_ksu.img
          sha256sum boot_ksu.img
          python3 -c "import struct; d=open('boot_ksu.img','rb').read(); ks,ka,rs,ra,ss,sa,ta,ps=struct.unpack_from('<8I',d,8); hv=struct.unpack_from('<I',d,40)[0]; print('size =',len(d)); print('magic =',d[:8]); print('header_version =',hv); print('kernel =',format(ks,','),'@ 0x%x'%ka); print('ramdisk =',format(rs,','),'@ 0x%x'%ra); print('pagesize =',ps)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: boot-ksu-umi
          path: |
            boot_ksu.img
            kernel/out/arch/arm64/boot/Image
          retention-days: 7

      # ---------------------------------------------------------------
      - name: 汇总
        if: always()
        run: |
          echo "## 编译结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f boot_ksu.img ]; then
            echo "✅ **boot_ksu.img 已生成**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh boot_ksu.img >> $GITHUB_STEP_SUMMARY
            sha256sum boot_ksu.img >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **打包失败**，检查上一步日志" >> $GITHUB_STEP_SUMMARY
          fi
